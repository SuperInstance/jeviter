# Publishes to GitHub Packages on release. Two fleet-specific fixes from
# the stock template:
#   1. GitHub Packages REJECTS unscoped npm names — the package publishes
#      to npm as `jeviter`, so we scope it just-in-time for GPR
#      (`@superinstance/jeviter`). npm's name stays untouched in git.
#   2. The name flip happens AFTER npm ci + npm test, against the
#      committed lockfile — no sync churn.

name: Publish to GitHub Packages

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test

  publish-gpr:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com/
      - run: npm ci
      - run: npm test
      - run: npm pkg set name=@superinstance/jeviter
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}
