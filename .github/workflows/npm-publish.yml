# Runs the suite on every push to main and every PR — the safety net
# that makes the release-triggered publish workflows below safe to fire.
# Engines say node >=18; the matrix pins the edges we claim.

name: Publish to npm

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - run: npm publish
        env:
          # Repo secret npm_token must be set (Settings → Secrets → Actions).
          # Without it this step fails at release time, by design — an
          # unpublished release is honest, a credentialed guess is not.
          NODE_AUTH_TOKEN: ${{secrets.npm_token}}
